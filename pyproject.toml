[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nctl"
version = "2.7.0"
description = "CLI scan management, Excel report masking, DB backup, restore and monitoring"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "XlsxWriter>=3.2,<4", "cryptography>=43,<47"]

[project.scripts]
nctl = "nctl.app:main"

[tool.setuptools.packages.find]
include = ["nctl*"]
